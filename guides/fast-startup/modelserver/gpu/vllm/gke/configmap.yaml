    """Entrypoint that starts `vllm serve` with the snapshot hook installed.

    Run as:  python3 -m docker.scripts.snapshot.launcher <vllm serve args...>

    Two placement rules, both of which fail silently if broken:

    1. This file must not be named __main__.py, and must not be invoked as
       `python3 -m snapshot`. When vLLM spawns child processes, CPython's spawn
       bootstrap re-imports the parent's main module as __mp_main__ -- which is
       how this patch reaches vLLM's spawned API server processes when
       --api-server-count > 1 -- but it skips modules whose name ends in
       ".__main__".
    2. The rebind must stay above the __main__ guard, for the same reason.
    """

    import sys

    from vllm.entrypoints.openai import api_server

    from .vllm.wrapper import patch_vllm_lifespan

    _orig_build_app = api_server.build_app


    def _build_app(*args, **kwargs):
        return patch_vllm_lifespan(_orig_build_app(*args, **kwargs))


    api_server.build_app = _build_app

    if __name__ == "__main__":
        from vllm.entrypoints.cli.main import main

        from .vllm.wrapper import WORKER_EXTENSION_CLS, write_kvs_file

        argv = list(sys.argv[1:])

        # The checkpoint hooks have to run in the worker processes -- they, not the API
        # server, own the NCCL communicators. See vllm/worker.py.
        if not any(a.split("=", 1)[0] == "--worker-extension-cls" for a in argv):
            argv.append(f"--worker-extension-cls={WORKER_EXTENSION_CLS}")

        # Publish the rendezvous endpoint up front so the file is in place no matter
        # when the shim reads it. The KV store itself is not started until after the
        # snapshot restores.
        write_kvs_file()

        sys.argv = ["vllm", "serve", *argv]
        main()
  providers.py: |
    """
    Snapshot Providers for GKE Fast Pod Snapshotting.

    This module provides GKESnapshotProvider for triggering gVisor sandbox checkpoints
    and clearing model weight caches when configured.
    """

    from __future__ import annotations

    import errno
    import os
    import pathlib
    import shutil
    from typing import Optional

    from vllm.logger import init_logger

    logger = init_logger("vllm.snapshot.providers")

    GVISOR_CHECKPOINT_PATH = "/proc/gvisor/checkpoint"


    class SnapshotError(RuntimeError):
        """Raised when container process snapshotting or cache clearing fails."""
        pass


    class GKESnapshotProvider:
        """
        Snapshot provider for GKE Sandboxes using gVisor's procfs control interface.
        Clears cached weight files if a cache directory is explicitly specified,
        and triggers container checkpointing by writing to /proc/gvisor/checkpoint.
        """

        def __init__(
            self,
            proc_path: str = GVISOR_CHECKPOINT_PATH,
            cache_dir: Optional[str] = None,
        ) -> None:
            self.proc_path = proc_path
            self.cache_dir = cache_dir or os.getenv("SNAPSHOT_CLEAR_CACHE_DIR")

        def is_available(self) -> bool:
            """Check if the gVisor procfs checkpoint interface is available and writable."""
            return os.path.exists(self.proc_path) and os.access(self.proc_path, os.W_OK)

        def clear_cache(self) -> None:
            """Clear out cached model weights if an explicit cache directory is configured.

            Requires vLLM to have been started with `--safetensors-load-strategy eager`.
            The default strategy memory-maps the weight files, so vLLM still holds
            mappings into them and deleting the cache would leave the snapshot pointing
            at files that no longer exist.
            """
            if not self.cache_dir:
                logger.debug("No cache directory specified to clear (SNAPSHOT_CLEAR_CACHE_DIR unset).")
                return

            target_path = pathlib.Path(os.path.expanduser(self.cache_dir))
            try:
                if target_path.exists():
                    logger.info("Clearing specified weight cache path contents: %s", target_path)
                    if target_path.is_file() or target_path.is_symlink():
                        target_path.unlink()
                    else:
                        for child in target_path.iterdir():
                            if child.is_file() or child.is_symlink():
                                child.unlink()
                            else:
                                shutil.rmtree(child)
                else:
                    logger.debug("Cache path does not exist: %s", target_path)
            except OSError as e:
                logger.error("Failed to clear weight cache at %s: %s", target_path, e)

        def trigger(self) -> None:
            """Execute weight cache clearing followed by gVisor checkpoint triggering."""
            if not self.is_available():
                logger.warning(
                    "gVisor checkpoint interface '%s' is not available or writable. Skipping snapshot checkpoint.",
                    self.proc_path,
                )
                return

            self.clear_cache()

            try:
                fd = os.open(self.proc_path, os.O_RDWR)
            except OSError as e:
                logger.error("Failed to open gVisor checkpoint file '%s': %s", self.proc_path, e)
                return

            try:
                try:
                    os.write(fd, b"1")
                except OSError as e:
                    logger.error("Failed to write to gVisor checkpoint file: %s", e)
                    return

                try:
                    # Attempting to read 1 byte blocks until checkpoint/restore completes.
                    res = os.read(fd, 1)
                except OSError as e:
                    if e.errno == errno.EINVAL:
                        logger.error("gVisor snapshot was never initiated: %s", e)
                    else:
                        logger.error("gVisor checkpoint failed during restore wait: %s", e)
                    return

                if res and res not in (b"", b"r", b"e"):
                    logger.warning("gVisor checkpoint returned unexpected status: %r", res)

                logger.info("gVisor checkpoint completed successfully")
            finally:
                os.close(fd)

  wrapper.py: |
    """vLLM lifespan patch for GKE fast pod snapshotting.

    Wraps vLLM's FastAPI lifespan so that, after the engine has finished initializing
    but before uvicorn binds its port, the pod:

    1. Releases physical VRAM with engine.sleep(level=1), keeping virtual addresses stable.
    2. Destroys every NCCL communicator, on all ranks, via the checkpoint shim.
    3. Triggers the gVisor sandbox checkpoint and blocks until the sandbox is restored.
    4. Starts the rendezvous KV store and rebuilds the communicators, on all ranks.
    5. Re-maps VRAM with engine.wake_up() and hands control back to uvicorn.

    The checkpoint deliberately happens before `yield`, so the snapshot contains no
    listening sockets. That is also why the KV store is started after the restore
    rather than at pod start -- see ensure_kvs_server().
    """

    from __future__ import annotations

    import asyncio
    import os
    import pathlib
    import shutil
    import socket
    import subprocess
    import time
    from contextlib import asynccontextmanager
    from typing import Optional

    from vllm.logger import init_logger

    from ..providers import GKESnapshotProvider, SnapshotError

    logger = init_logger("vllm.snapshot.wrapper")

    WORKER_EXTENSION_CLS = (
        "docker.scripts.snapshot.vllm.worker.NCCLCheckpointWorkerExtension"
    )

    DEFAULT_KVS_PATH = "/var/run/nccl/kvs.txt"
    DEFAULT_KVS_ADDR = "127.0.0.1:6379"

    # ncclCheckpointRestore polls the KV store for up to NCCL_CHECKPOINT_KVS_TIMEOUT
    # (300s upstream default). Let the RPC outlast that so a KVS problem surfaces as the
    # shim's own error rather than as an opaque RPC timeout.
    PREPARE_RPC_TIMEOUT_S = 120.0
    RESTORE_RPC_TIMEOUT_S = 420.0

    # Keeps the KV store from being garbage collected out from under us.
    _kvs_proc: Optional[subprocess.Popen] = None


    def kvs_path() -> pathlib.Path:
        return pathlib.Path(os.getenv("NCCL_CHECKPOINT_KVS_PATH", DEFAULT_KVS_PATH))


    def kvs_addr() -> tuple[str, int]:
        host, _, port = os.getenv("NCCL_CHECKPOINT_KVS_ADDR", DEFAULT_KVS_ADDR).partition(":")
        return host or "127.0.0.1", int(port or 6379)


    def write_kvs_file() -> None:
        """Publish the KV store endpoint where the shim looks for it.

        kv_store_client.cc reads NCCL_CHECKPOINT_KVS_PATH and parses the contents as
        "<host>:<port>[/<prefix>]". The file only names an endpoint -- writing it does
        not create a KV store.
        """
        host, port = kvs_addr()
        path = kvs_path()
        path.parent.mkdir(parents=True, exist_ok=True)
        path.write_text(f"{host}:{port}")
        logger.info("NCCL rendezvous endpoint %s:%s written to %s", host, port, path)


    def _kvs_listening(host: str, port: int, timeout: float = 0.25) -> bool:
        try:
            with socket.create_connection((host, port), timeout=timeout):
                return True
        except OSError:
            return False


    def ensure_kvs_server(startup_timeout: float = 15.0) -> Optional[subprocess.Popen]:
        """Start the NCCL rendezvous KV store unless something is already listening.

        Runs in this container as a child process rather than as a sidecar, and only
        after the checkpoint has been restored. The store is scratch space for one
        rendezvous -- rank 0 writes fresh ncclUniqueIds, the other ranks read them --
        so nothing in it needs to survive the freeze, and IDs captured before the
        checkpoint would be stale anyway. Starting it earlier would also put the first
        bound TCP socket into the snapshot, which this design otherwise avoids.
        """
        global _kvs_proc

        host, port = kvs_addr()
        if _kvs_listening(host, port):
            logger.info("NCCL rendezvous KV store already listening on %s:%s", host, port)
            return _kvs_proc

        redis_server = shutil.which("redis-server")
        if redis_server is None:
            raise SnapshotError(
                "redis-server not found on PATH. The upstream NCCL checkpoint shim "
                "speaks RESP and has no file-backed KV store; install redis-server or "
                "point NCCL_CHECKPOINT_KVS_ADDR at a reachable one."
            )

        proc = subprocess.Popen(
            [
                redis_server,
                "--bind", host,
                "--port", str(port),
                "--protected-mode", "no",
                # Rendezvous state is worthless once restore completes; never persist it.
                "--save", "",
                "--appendonly", "no",
            ],
            stdout=subprocess.DEVNULL,
            stderr=subprocess.STDOUT,
        )

        deadline = time.monotonic() + startup_timeout
        while time.monotonic() < deadline:
            if proc.poll() is not None:
                raise SnapshotError(
                    f"redis-server exited immediately with status {proc.returncode}"
                )
            if _kvs_listening(host, port):
                logger.info(
                    "Started NCCL rendezvous KV store on %s:%s (pid %s)", host, port, proc.pid
                )
                _kvs_proc = proc
                return proc
            time.sleep(0.1)

        proc.kill()
        raise SnapshotError(
            f"redis-server did not accept connections on {host}:{port} "
            f"within {startup_timeout}s"
        )


    async def _rendezvous(engine) -> None:
        """Bring up the KV store and rebuild NCCL communicators on every rank."""
        ensure_kvs_server()
        write_kvs_file()
        logger.info("Rebuilding NCCL communicators on all ranks...")
        await engine.collective_rpc(
            "nccl_checkpoint_restore", timeout=RESTORE_RPC_TIMEOUT_S
        )


    async def _snapshot_and_restore(engine, provider: GKESnapshotProvider) -> None:
        """Run the checkpoint/restore sequence.

        Failure handling is deliberately asymmetric. Before any communicator has been
        touched, giving up and serving normally is strictly better than crashlooping.
        Once ncclCheckpointPrepare() has run the communicators are gone, and a pod that
        keeps going without rebuilding them would accept traffic and fail every
        collective -- so from that point on, failures are fatal.
        """
        # Check this before touching anything. Without a checkpoint interface the whole
        # sequence would still run -- destroying and rebuilding every communicator, and
        # starting a KV store -- to accomplish nothing but a slower startup.
        if not provider.is_available():
            logger.warning(
                "gVisor checkpoint interface is unavailable; skipping snapshot entirely "
                "and starting normally."
            )
            return

        try:
            logger.info("Snapshot 1/5: engine.sleep(level=1)")
            await engine.sleep(level=1)
        except Exception:
            logger.exception(
                "SNAPSHOT ABORTED: engine.sleep(level=1) failed -- is --enable-sleep-mode "
                "set? Nothing has been modified; serving normally."
            )
            return

        logger.info("Snapshot 2/5: quiescing NCCL communicators on all ranks")
        await engine.collective_rpc("nccl_checkpoint_prepare", timeout=PREPARE_RPC_TIMEOUT_S)

        try:
            logger.info("Snapshot 3/5: triggering checkpoint (blocks until restore)")
            await asyncio.to_thread(provider.trigger)
            logger.info("Snapshot 4/5: sandbox restored, re-rendezvousing NCCL")
        except Exception:
            logger.exception(
                "Checkpoint trigger failed. Communicators are already down, so they are "
                "being rebuilt in place before serving."
            )
            await _rendezvous(engine)
            await engine.wake_up()
            return

        await _rendezvous(engine)

        logger.info("Snapshot 5/5: engine.wake_up()")
        await engine.wake_up()
        logger.info("Snapshot restore complete; handing off to uvicorn.")


    def patch_vllm_lifespan(app, snapshot_provider: Optional[GKESnapshotProvider] = None):
        """Patch the FastAPI app's lifespan to checkpoint the pod during startup.

        Args:
            app: The vLLM FastAPI application instance.
            snapshot_provider: Snapshot provider. Defaults to GKESnapshotProvider() when
                SNAPSHOT_PROVIDER is 'gke', 'gvisor' or 'gke_gvisor'; otherwise the app
                is returned unmodified.
        """
        if snapshot_provider is None:
            provider_type = os.getenv("SNAPSHOT_PROVIDER", "").lower()
            if provider_type not in ("gke", "gvisor", "gke_gvisor"):
                logger.info(
                    "Snapshot provider disabled (SNAPSHOT_PROVIDER=%r). Lifespan unmodified.",
                    provider_type,
                )
                return app
            snapshot_provider = GKESnapshotProvider()

        original_lifespan = app.router.lifespan_context

        @asynccontextmanager
        async def patched_lifespan(app_inst):
            async with original_lifespan(app_inst) as state:
                engine = getattr(app_inst.state, "engine_client", None)
                if engine is None:
                    logger.error(
                        "No engine_client on app state; skipping snapshot and serving normally."
                    )
                else:
                    await _snapshot_and_restore(engine, snapshot_provider)
                yield state

        app.router.lifespan_context = patched_lifespan
        logger.info("Patched vLLM lifespan for GKE snapshotting with the NCCL checkpoint shim.")
        return app
  worker.py: |
    """NCCL checkpoint hooks, executed in the vLLM worker processes.

    At TP>1 the NCCL communicators do not live in the process that patches the FastAPI
    lifespan. vLLM v1 runs an API server process (uvicorn + AsyncLLM), an EngineCore
    process (scheduler + MultiprocExecutor), and one worker process per rank; only the
    workers hold communicators. ncclCheckpointPrepare() and ncclCheckpointRestore() are
    collective over those ranks, so they have to be dispatched with collective_rpc.

    This class is mixed into vLLM's Worker via --worker-extension-cls. See
    vllm/v1/worker/worker_base.py, which dynamically appends it to Worker.__bases__ and
    exposes its public methods to collective_rpc.
    """

    from __future__ import annotations

    import ctypes
    import os
    import threading

    from vllm.logger import init_logger

    logger = init_logger("vllm.snapshot.worker")

    # ncclResult_t, from nccl.h.
    _NCCL_SUCCESS = 0
    _NCCL_RESULT_NAMES = {
        0: "ncclSuccess",
        1: "ncclUnhandledCudaError",
        2: "ncclSystemError",
        3: "ncclInternalError",
        4: "ncclInvalidArgument",
        5: "ncclInvalidUsage",
        6: "ncclRemoteError",
        7: "ncclInProgress",
    }

    _handle_lock = threading.Lock()
    _handle: ctypes.CDLL | None = None
    _version_logged = False


    class NCCLCheckpointError(RuntimeError):
        """An ncclCheckpoint* entry point is missing or returned an error."""


    def _global_scope() -> ctypes.CDLL:
        """Handle to the process-global symbol scope, where LD_PRELOAD put the shim.

        nccl_checkpoint.h resolves these entry points with dlsym(RTLD_DEFAULT, ...);
        ctypes.CDLL(None) is the equivalent. Opening the .so by path would instead give
        an RTLD_LOCAL handle to a second mapping of the library rather than to the
        preloaded interposer that is actually wrapping this process's NCCL calls.
        """
        global _handle
        with _handle_lock:
            if _handle is None:
                _handle = ctypes.CDLL(None)
        return _handle


    def _resolve(name: str):
        try:
            fn = getattr(_global_scope(), name)
        except AttributeError as exc:
            raise NCCLCheckpointError(
                f"{name} is not in the global symbol scope. The NCCL checkpoint shim "
                f"must be preloaded; LD_PRELOAD is currently "
                f"{os.environ.get('LD_PRELOAD', '<unset>')!r}."
            ) from exc
        fn.restype = ctypes.c_int
        return fn


    def _log_shim_version() -> None:
        """Log the shim/NCCL version pair once, as a liveness check on the shim."""
        global _version_logged
        if _version_logged:
            return
        _version_logged = True
        try:
            fn = _resolve("ncclCheckpointGetVersion")
            fn.argtypes = [ctypes.POINTER(ctypes.c_int), ctypes.POINTER(ctypes.c_int)]
            checkpoint_version = ctypes.c_int()
            nccl_version = ctypes.c_int()
            res = fn(ctypes.byref(checkpoint_version), ctypes.byref(nccl_version))
            if res == _NCCL_SUCCESS:
                logger.info(
                    "NCCL checkpoint shim v%s against NCCL %s",
                    checkpoint_version.value,
                    nccl_version.value,
                )
            else:
                logger.warning("ncclCheckpointGetVersion() returned %s", _describe(res))
        except NCCLCheckpointError as exc:
            logger.warning("Could not read NCCL checkpoint shim version: %s", exc)


    def _describe(res: int) -> str:
        return f"{_NCCL_RESULT_NAMES.get(res, 'unknown')} ({res})"


    def _call(name: str) -> None:
        fn = _resolve(name)
        fn.argtypes = []
        res = fn()
        if res != _NCCL_SUCCESS:
            raise NCCLCheckpointError(f"{name}() returned {_describe(res)}")


    class NCCLCheckpointWorkerExtension:
        """Checkpoint hooks callable via AsyncLLM.collective_rpc.

        Method names must not collide with anything already on vLLM's Worker --
        worker_base.py asserts that before injecting this class, and a collision is a
        hard startup failure. Keep this class to the two RPC entry points; helpers
        belong at module scope.
        """

        def nccl_checkpoint_prepare(self) -> None:
            """Quiesce and destroy every NCCL communicator on this rank.

            Collective: all ranks must call it. Nothing may touch a communicator
            between this and nccl_checkpoint_restore().
            """
            rank = getattr(self, "rank", "?")
            _log_shim_version()
            logger.info("Rank %s: ncclCheckpointPrepare()", rank)
            _call("ncclCheckpointPrepare")
            logger.info("Rank %s: ncclCheckpointPrepare() done", rank)

        def nccl_checkpoint_restore(self) -> None:
            """Rebuild every communicator destroyed by nccl_checkpoint_prepare().

            Collective. Rank 0 generates fresh ncclUniqueIds and publishes them to the
            KV store named by NCCL_CHECKPOINT_KVS_PATH; the other ranks poll for them.
            A KVS that is not listening shows up here as a stall of up to
            NCCL_CHECKPOINT_KVS_TIMEOUT (300s upstream default), not as a fast failure.
            """
            rank = getattr(self, "rank", "?")
            logger.info("Rank %s: ncclCheckpointRestore()", rank)
            _call("ncclCheckpointRestore")
            logger.info("Rank %s: ncclCheckpointRestore() done", rank)
