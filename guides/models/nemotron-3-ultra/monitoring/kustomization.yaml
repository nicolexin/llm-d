apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# NVIDIA-Nemotron-3-Ultra monitoring overlay.
#
# This is an overlay of the generic recipes/modelserver/components/monitoring-pd
# component, which defines the decode and prefill PodMonitors on the
# "modelserver" port. Each pod runs one vLLM API server (prefill on 8000, decode
# on 8200 behind the routing sidecar), so the component's port is the right one.
# The patch below only tightens the scrape interval to 5s, and the labels
# transformer scopes the PodMonitors to this guide's pods (the labels must match
# ../modelserver/gpu/vllm/base/kustomization.yaml).
components:
  - ../../../recipes/modelserver/components/monitoring-pd

labels:
  - pairs:
      llm-d.ai/guide: agentic-serving-gpu
      llm-d.ai/model: NVIDIA-Nemotron-3-Ultra-550B-A55B-FP8-block
    includeSelectors: true
    fields:
      - group: monitoring.coreos.com
        version: v1
        kind: PodMonitor
        path: metadata/labels
        create: true
      - group: monitoring.coreos.com
        version: v1
        kind: PodMonitor
        path: spec/selector/matchLabels
        create: true

patches:
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: PodMonitor
    patch: |-
      - op: replace
        path: /spec/podMetricsEndpoints
        value:
          - port: modelserver
            path: /metrics
            interval: 5s
